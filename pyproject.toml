[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qubitguard"
version = "0.1.0"
description = "Reproducible quantum error correction experiments"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "stim>=1.15,<2", "pymatching>=2.3,<3", "numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
deltakit = ["deltakit>=0.10,<0.11; python_version >= '3.11'"]

[project.scripts]
qubitguard-benchmark = "qubitguard.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
