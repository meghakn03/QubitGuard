services:
  backend:
    build: .
    environment:
      QUBITGUARD_DB: /app/data/qubitguard.sqlite
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - experiments:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  experiments:
